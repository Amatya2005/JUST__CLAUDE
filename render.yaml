# Render blueprint: provisions the web service and its Postgres database.
# Deploy with: Render dashboard -> New -> Blueprint -> point at this repo.
#
# PHYLLO_CLIENT_ID, PHYLLO_SECRET and PHYLLO_WEBHOOK_SECRET are marked
# sync:false, so Render prompts for them at deploy time instead of storing
# them in this file. Never commit real credentials here.
services:
  - type: web
    name: justinfluence
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: justinfluence-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PHYLLO_ENV
        value: sandbox
      - key: PHYLLO_BASE_URL
        value: https://api.sandbox.insightiq.ai
      - key: PHYLLO_CLIENT_ID
        sync: false
      - key: PHYLLO_SECRET
        sync: false
      - key: PHYLLO_WEBHOOK_SECRET
        sync: false
      # FRONTEND_URL is what invite links point at. Set it to this service's
      # public URL once Render assigns one (e.g. https://justinfluence.onrender.com).
      - key: FRONTEND_URL
        sync: false

databases:
  - name: justinfluence-db
    plan: free
    databaseName: justinfluence
