name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: justinfluence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Apply schema
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/justinfluence_test
          PGSSLMODE: disable

      - name: Smoke test API
        run: node scripts/smoke-test.js
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/justinfluence_test
          PGSSLMODE: disable
          JWT_SECRET: ci_secret_that_is_at_least_32_characters_long
          PORT: 4000
